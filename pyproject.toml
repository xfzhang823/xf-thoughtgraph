[project]
name = "xf-thoughtgraph"
version = "0.1.0"
description = "Reusable LLM-powered complex-topic disaggregation and thought graphs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.9",
]

[project.optional-dependencies]
providers = [
    "anthropic>=0.120.0",
    "python-dotenv>=1.0",
    "openai>=2.48.0",
]
dev = [
    "pylint>=4.0.8",
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["xf_thoughtgraph*"]

[dependency-groups]
dev = [
    "pylint>=4.0.8",
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
